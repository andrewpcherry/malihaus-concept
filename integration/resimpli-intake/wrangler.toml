# Held deployment. Verify the intended account before applying changes.
name = "malihaus-lead-intake"
main = "worker.js"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]
[[durable_objects.bindings]]
name = "PPC_INTAKE"
class_name = "PpcIntake"
[[migrations]]
tag = "ppc-intake-sqlite-v1"
new_sqlite_classes = ["PpcIntake"]
[vars]
ALLOWED_ORIGINS = "https://www.malihaus.com"
DELIVERY_ENABLED = "false"
WEBSITE_DELIVERY_ENABLED = "false"
QA_ENABLED = "false"
PRODUCTION_QA_ENABLED = "false"
# Secrets: ZAPIER_INTAKE_HOOK, INTAKE_STORAGE_KEY (base64 of 32 random bytes),
# QA_AUTH_TOKEN for private server-to-server acceptance tests.
# REsimpli API credentials remain in their existing private Zapier connection.
